name: Upgrade BakaSU

on:
  workflow_dispatch:
    inputs:
      bakasu_run_id:
        description: "BakaSU Actions run ID（优先，例如 40052601035）"
        required: false
        type: string
      bakasu_commit:
        description: "BakaSU commit SHA（不填则从 run 取）"
        required: false
        type: string
      bakasu_build_no:
        description: "BakaSU 构建号（例如 35438；run_id 为空时尝试按 run number 查找）"
        required: false
        type: string

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0" || \
          sdkmanager "platform-tools" "platforms;android-37"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Resolve BakaSU run and commit
        env:
          GH_TOKEN: ${{ secrets.BAKASU_GH_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.bakasu_run_id }}
          INPUT_COMMIT: ${{ inputs.bakasu_commit }}
          INPUT_BUILD_NO: ${{ inputs.bakasu_build_no }}
        run: |
          set -euo pipefail
          REPO="Baka-SU/BakaSU"
          RUN_ID="${INPUT_RUN_ID:-}"
          COMMIT="${INPUT_COMMIT:-}"

          if [[ -z "$RUN_ID" && -n "$INPUT_BUILD_NO" ]]; then
            echo "按 run number 查找 #$INPUT_BUILD_NO ..."
            RUN_ID="$(gh run list -R "$REPO" --limit 1000 \
              --json databaseId,number,headSha,createdAt \
              | jq -r --arg n "$INPUT_BUILD_NO" '
                [.[] | select((.number|tostring)==$n)]
                | sort_by(.createdAt) | reverse | .[0].databaseId // empty
              ')"
          fi

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::未找到 BakaSU run。请填写 bakasu_run_id，或从 Actions 页面复制 run ID/commit SHA。"
            exit 1
          fi

          if [[ -z "$COMMIT" ]]; then
            COMMIT="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .head_sha)"
          fi

          echo "BAKASU_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "BAKASU_COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "BakaSU run=$RUN_ID commit=$COMMIT"

      - name: Download BakaSU CI artifacts
        env:
          GH_TOKEN: ${{ secrets.BAKASU_GH_TOKEN }}
          BAKASU_RUN_ID: ${{ env.BAKASU_RUN_ID }}
        run: |
          set -euo pipefail
          REPO="Baka-SU/BakaSU"
          mkdir -p .work/bakasu/manager .work/bakasu/ksud .work/bakasu/ksuinit
          gh run download "$BAKASU_RUN_ID" -R "$REPO" -n Manager-release -D .work/bakasu/manager
          gh run download "$BAKASU_RUN_ID" -R "$REPO" -n ksud-aarch64-linux-android -D .work/bakasu/ksud
          gh run download "$BAKASU_RUN_ID" -R "$REPO" -n ksuinit-aarch64 -D .work/bakasu/ksuinit || true

      - name: Checkout BakaSU source at commit
        env:
          BAKASU_COMMIT: ${{ env.BAKASU_COMMIT }}
        run: |
          set -euo pipefail
          mkdir -p third_party
          if [[ ! -d third_party/BakaSU/.git ]]; then
            git clone --filter=blob:none https://github.com/Baka-SU/BakaSU.git third_party/BakaSU
          fi
          git -C third_party/BakaSU fetch --all --tags
          git -C third_party/BakaSU checkout --force "$BAKASU_COMMIT"
          git -C third_party/BakaSU rev-parse HEAD

      - name: Replace manager assets
        run: |
          set -euo pipefail
          ASSETS="app/app/src/main/assets/pyb110"
          mkdir -p "$ASSETS"

          APK="$(find .work/bakasu/manager -type f -name '*.apk' | head -n1)"
          KSUD="$(find .work/bakasu/ksud -type f \( -name 'ksud' -o -name 'ksud-*' \) | head -n1)"
          [[ -n "$APK" && -f "$APK" ]] || { echo "::error::未找到 Manager APK"; exit 1; }
          [[ -n "$KSUD" && -f "$KSUD" ]] || { echo "::error::未找到 ksud arm64"; exit 1; }

          install -m 0644 "$APK" "$ASSETS/Manager-release.apk"
          install -m 0755 "$KSUD" "$ASSETS/ksud"

          KSUINIT="$(find .work/bakasu/ksuinit -type f -name 'ksuinit*' 2>/dev/null | head -n1 || true)"
          if [[ -n "$KSUINIT" && -f "$KSUINIT" ]]; then
            install -m 0755 "$KSUINIT" "$ASSETS/ksuinit"
          fi

          ls -l "$ASSETS"

      - name: Build BakaSU LKM
        env:
          BAKASU_SRC: ${{ github.workspace }}/third_party/BakaSU
          BAKASU_COMMIT: ${{ env.BAKASU_COMMIT }}
          OUT_DIR: ${{ github.workspace }}/lkm/out/bakasu
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          bash lkm/build-bakasu.sh

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          mkdir -p app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/keystore/release.jks
          cat > app/keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties
          # 如果 build.gradle.kts 的字段名不同，按仓库实际字段调整这里

      - name: Build release APK
        run: |
          cd app
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PYB110-OneClick-release-${{ env.BAKASU_COMMIT }}
          path: |
            app/app/build/outputs/apk/release/*.apk
            lkm/out/bakasu/**/*.ko
          if-no-files-found: error
