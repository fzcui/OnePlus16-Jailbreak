name: Build OnePlus16 Jailbreak APK

on:
  workflow_dispatch: {} # 支持手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # 安装 Android 37 预览版和构建工具
          sdkmanager --channel=3 --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          # 创建软链接，防止 Gradle 找不到 android-37
          ln -sf "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37" || true

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties

      - name: Make gradlew executable
        run: chmod +x app/gradlew

      - name: Build Debug APK
        run: |
          cd app
          # 直接打 Debug 包，不需要复杂的 keystore 签名配置
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus16-Jailbreak-Debug
          # 上传生成的 APK 文件
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
